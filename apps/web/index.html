<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ INP Debugger Workspace</title>
    
    <!-- PWA Integration headers -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="https://img.icons8.com/neon/96/lightning-bolt.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="High-fidelity, interactive diagnostic workspace for Interaction to Next Paint (INP) automated audits and main-thread long-tasks correlation." />
    
    <!-- Apple & Standard PWA standalone app support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="INP Debugger" />
  </head>
  <body class="bg-[#f8fafc]">
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- PWA Service Worker Registration & Local Cleanroom -->
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // Proactively unregister any active service worker during local development to avoid caching HMR/Vite chunks
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.unregister().then((success) => {
                if (success) {
                  console.log('🧹 Cleaned active development Service Worker to avoid Vite HMR caching.');
                  // Clear active caches to release any locked resources
                  caches.keys().then((keys) => {
                    keys.forEach(key => caches.delete(key));
                  });
                }
              });
            }
          });
        } else {
          // Register PWA service worker in non-local production environments
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('⚡ Service Worker registered with scope:', reg.scope))
              .catch(err => console.error('❌ Service Worker registration failed:', err));
          });
        }
      }
    </script>
  </body>
</html>
